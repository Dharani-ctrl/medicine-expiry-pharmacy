{% extends 'base.html' %}

{% block title %}Change Password - Pharmacy System{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{{ url_for('admin.profile') }}" class="text-decoration-none text-muted">
        <i class="fas fa-arrow-left me-1"></i> Back to Profile
    </a>
    <h3 class="fw-bold mt-2">Change Admin Password</h3>
    <p class="text-muted mb-0">Ensure your system password is strong and secure.</p>
</div>

<div class="card border-0 shadow-sm rounded-4 col-lg-6">
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('admin.change_password') }}">
            <div class="mb-3">
                <label class="form-label fw-bold">Current Password <span class="text-danger">*</span></label>
                <input type="password" class="form-control" name="current_password" required placeholder="Enter current admin password">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">New Password <span class="text-danger">*</span></label>
                <input type="password" class="form-control" name="new_password" required placeholder="At least 6 characters">
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Confirm New Password <span class="text-danger">*</span></label>
                <input type="password" class="form-control" name="confirm_password" required placeholder="Re-enter new password">
            </div>
            <button type="submit" class="btn btn-primary fw-bold px-4 py-2">
                <i class="fas fa-shield-alt me-1"></i> Update Password
            </button>
            <a href="{{ url_for('admin.profile') }}" class="btn btn-outline-secondary ms-2 px-4 py-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
