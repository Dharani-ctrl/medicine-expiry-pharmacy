{% extends 'base.html' %}

{% block title %}Admin Profile - Pharmacy System{% endblock %}

{% block content %}
<div class="mb-4">
    <h3 class="fw-bold mb-1">Admin Profile Settings</h3>
    <p class="text-muted mb-0">Manage your system administrator account profile information.</p>
</div>

<div class="card border-0 shadow-sm rounded-4 col-lg-7">
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('admin.profile') }}">
            <div class="mb-3">
                <label class="form-label fw-bold">Admin Username <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="username" value="{{ admin.username }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Email Address <span class="text-danger">*</span></label>
                <input type="email" class="form-control" name="email" value="{{ admin.email }}" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold text-muted">Role</label>
                <input type="text" class="form-control bg-light" value="System Administrator" readonly>
            </div>
            <button type="submit" class="btn btn-primary fw-bold px-4 py-2">
                <i class="fas fa-save me-1"></i> Update Profile
            </button>
            <a href="{{ url_for('admin.change_password') }}" class="btn btn-outline-secondary ms-2 px-4 py-2">
                <i class="fas fa-key me-1"></i> Change Password
            </a>
        </form>
    </div>
</div>
{% endblock %}
